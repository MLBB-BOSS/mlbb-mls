name: Initialize Repository Structure and Deploy to Heroku

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.py'
      - '**.json'
      - '**.sh'
      - '**.yml'
      - '**/'

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Checkout репозиторію
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      # Крок 2: Налаштування Git
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Крок 3: Встановлення Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Крок 4: Встановлення залежностей (якщо потрібні)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Крок 5: Запуск скрипту для створення структури
      - name: Run structure initialization script
        run: |
          python scripts/create_structure.py

      # Крок 6: Перевірка змін
      - name: Check for changes
        id: changes
        run: |
          git add .
          git diff --cached --exit-code || echo "Changes detected"

      # Крок 7: Коміт змін, якщо вони існують
      - name: Commit changes
        if: steps.changes.outputs.exit-code != '0'
        run: |
          git commit -m "Initialize directory structure for new version"

      # Крок 8: Деплой на Heroku
      - name: Deploy to Heroku
        if: steps.changes.outputs.exit-code != '0'
        uses: uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          
