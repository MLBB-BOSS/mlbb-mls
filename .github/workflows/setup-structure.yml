name: Setup Repository Structure and Distribute Code

on:
  push:
    branches:
      - main

jobs:
  setup-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Folder Structure
        run: |
          # Enable error logging
          set -e

          # Core folders for repository structure
          mkdir -p .github/workflows
          mkdir -p handlers
          mkdir -p utils
          mkdir -p data/heroes
          mkdir -p data/skills
          mkdir -p data/items
          mkdir -p data/emblems
          mkdir -p data/menus
          mkdir -p data/builds
          mkdir -p tests
          mkdir -p docs/features
          mkdir -p scripts
          mkdir -p config

      - name: Distribute Code Files
        run: |
          # Move core configuration
          mv main\ \(9\).py main.py
          mv main\ \(8\).py bot.py
          
          # Config file
          echo "Moving config/settings.py"
          mkdir -p config
          echo 'import os\nclass Config:\n\tBOT_TOKEN = os.getenv("BOT_TOKEN")\n\tOPENAI_API_KEY = os.getenv("OPENAI_API_KEY")\nconfig = Config()' > config/settings.py

          # Handlers setup
          echo "Setting up handlers"
          mv handlers/__init__.py || true
          mv handlers/main_menu.py || true
          mv handlers/hero_handler.py || true
          mv handlers/trigger_handler.py || true

          # Utils setup
          echo "Setting up utils"
          mv utils/openai_api.py || true
          mv utils/data_loader.py || true
          mv utils/template_loader.py || true

          # Data files
          echo "Setting up data files"
          mv heroes_tanks\ \(7\).json data/heroes/tanks.json || true
          mv prompts\ \(2\).json data/prompts.json || true
          mv passive_skills\ \(2\).json data/skills/passive_skills.json || true

          # Move Prompts
          echo "Setting up prompts"
          mv prompts_message.html data/prompts_message.html || true

      - name: Commit and Push Updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Setup repository structure and distribute files" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main || echo "Nothing to push"
