name: Initialize Repository Structure

on:
  push:
    branches:
      - main

jobs:
  initialize-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up folder structure
        run: |
          # Створення всіх необхідних папок
          mkdir -p .github/workflows
          mkdir -p handlers
          mkdir -p utils
          mkdir -p data/heroes/Tank/Tigreal
          mkdir -p data/heroes/Fighter/Yin
          mkdir -p data/heroes/Marksman/Hilda
          mkdir -p data/heroes/Mage/Kimmy
          mkdir -p data/heroes/Assassin/Saber
          mkdir -p data/heroes/Support/Chip
          mkdir -p data/skills
          mkdir -p data/items
          mkdir -p data/emblems
          mkdir -p data/menus
          mkdir -p data/builds
          mkdir -p tests
          mkdir -p scripts
          mkdir -p docs/features
          mkdir -p config

          # Створення файлів тільки якщо вони не існують
          [ ! -f handlers/__init__.py ] && touch handlers/__init__.py
          [ ! -f handlers/main_menu.py ] && touch handlers/main_menu.py
          [ ! -f handlers/characters.py ] && touch handlers/characters.py
          [ ! -f utils/__init__.py ] && touch utils/__init__.py
          [ ! -f config/__init__.py ] && touch config/__init__.py
          [ ! -f config/settings.py ] && touch config/settings.py
          
          # Приклад для одного файлу JSON
          [ ! -f data/heroes/Tank/Tigreal/tigreal.json ] && touch data/heroes/Tank/Tigreal/tigreal.json
          
          # Додавання інших файлів (залежно від вашої структури)
          [ ! -f .gitignore ] && touch .gitignore && echo "__pycache__/" >> .gitignore
          [ ! -f Procfile ] && echo "worker: python main.py" > Procfile
          [ ! -f README.md ] && echo "# Telegram Bot" > README.md
          [ ! -f main.py ] && echo "# Main file for the bot" > main.py
          [ ! -f requirements.txt ] && echo "python-telegram-bot==13.7" > requirements.txt

      - name: Commit and push structure
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize complete repository structure" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main || echo "Nothing to push"
