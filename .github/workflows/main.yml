name: Initialize Repository Structure

on:
  push:
    branches:
      - main

jobs:
  setup-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up folder structure
        run: |
          # Створення папок
          mkdir -p .github/workflows
          mkdir -p data/heroes
          mkdir -p scripts
          mkdir -p tests
          
          # Додавання файлів
          echo "{}" > data/heroes/characters.json
          echo "# Empty file to keep directory in Git" > data/heroes/.gitkeep
          echo "# Empty file to keep directory in Git" > scripts/.gitkeep
          echo "# Empty file to keep directory in Git" > tests/.gitkeep
          
          # Створення основних файлів
          echo "worker: python bot.py" > Procfile
          echo "python-telegram-bot==13.7" > requirements.txt
          echo "# Telegram Bot" > README.md
          
          # Основний файл бота
          cat <<EOL > bot.py
          import logging
          from telegram.ext import Updater, CommandHandler

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)

          def start(update, context):
              update.message.reply_text("Привіт! Я ваш Telegram-бот.")

          def main():
              updater = Updater("YOUR_TELEGRAM_BOT_TOKEN", use_context=True)
              dp = updater.dispatcher
              dp.add_handler(CommandHandler("start", start))
              updater.start_polling()
              updater.idle()

          if __name__ == "__main__":
              main()
          EOL
          
          # .gitignore файл
          echo -e "__pycache__/\n*.pyc\n*.pyo\n.env\nvenv/" > .gitignore

      - name: Commit and push structure
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize repository structure"
          git push origin main
          
