# .github/workflows/deploy.yml
name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # Вкажіть версію Python, яку ви використовуєте

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test
      run: |
        # Додайте команди для запуску тестів, якщо вони є
        echo "Тести не налаштовані"

    - name: Deploy to Heroku
      uses: akshnz/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}  # або вкажіть назву вашого додатку без Secrets
        heroku_email: your_email@example.com  # Замініть на ваш email, зареєстрований на Heroku
